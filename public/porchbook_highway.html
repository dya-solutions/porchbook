<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Endless Highway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: full-bleed road view, a dashboard strip at the top, thumb controls docked at the bottom like a car console.
   Single look: a daylight drive with dark smoked-glass controls. */
:root {
  --ground: #0e2233;
  --glass: rgba(10, 24, 36, 0.72);
  --edge: rgba(255, 255, 255, 0.22);
  --ink: #f2f6fa;
  --muted: #a9bccb;
  --sign: #f4c542;          /* highway-sign amber */
  --go: #7fe3a0;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--ground); color: var(--ink); font-family: var(--body); overflow: hidden; touch-action: none; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
}
.plate { background: var(--glass); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.name { font-family: var(--display); font-weight: 700; font-size: 1.15rem; letter-spacing: 0.06em; text-transform: uppercase; }
.name small { display: block; font-family: var(--body); font-weight: 400; font-size: 0.75rem; letter-spacing: 0; text-transform: none; color: var(--muted); }
.gauges { font-family: var(--mono); font-size: 0.78rem; text-align: right; font-variant-numeric: tabular-nums; line-height: 1.5; }
.gauges b { font-family: var(--display); font-size: 1.5rem; font-weight: 700; color: var(--sign); }
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding-top: 14px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 10px; background: linear-gradient(transparent, rgba(8, 18, 28, 0.85) 45%);
}
.row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; align-items: end; }
.cruise-stack { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.song-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
button, .file {
  font-family: var(--display); font-weight: 700; font-size: 1rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink); background: var(--glass); border: 1px solid var(--edge); border-radius: 10px; min-height: 54px; padding: 0 12px;
  cursor: pointer; user-select: none; -webkit-user-select: none; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
button:focus-visible, .file:focus-within { outline: 2px solid var(--sign); outline-offset: 2px; }
button.on { color: var(--go); border-color: var(--go); }
#brake { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#brake.on { color: #ff8a7a; border-color: #ff8a7a; }
#night.on { color: #d7e4ff; border-color: #d7e4ff; }
#steer { position: fixed; z-index: 6; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 150px);
  min-height: 44px; padding: 0 14px; font-size: 0.85rem; border-radius: 999px; }
body, body * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#steer.on { color: #ffb347; border-color: #ffb347; }
#steer-menu { position: fixed; z-index: 6; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 202px);
  display: flex; flex-direction: column; gap: 8px; }
#steer-menu button { min-height: 42px; padding: 0 14px; font-size: 0.8rem; border-radius: 999px; }
#face-view { left: calc(max(12px, env(safe-area-inset-left, 0px)) + 92px) !important; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px) !important; }
/* During a race the steering buttons step out of the way of Left / Right (steering itself keeps working). */
body.is-racing #steer, body.is-racing #steer-menu { display: none !important; }
#tilt.on { color: #ffb347; border-color: #ffb347; box-shadow: 0 0 12px rgba(248, 160, 24, 0.45); }
#face.on { color: #ffb347; border-color: #ffb347; box-shadow: 0 0 12px rgba(248, 160, 24, 0.45); }
#face-view { position: fixed; z-index: 6; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 202px);
  width: 66px; height: 88px; border-radius: 12px; overflow: hidden; border: 2px solid #ffb347; background: #000; }
#face-video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.85; }
#face-dot { position: absolute; bottom: 6px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 99px;
  background: #ffb347; box-shadow: 0 0 8px #ffb347; transition: transform 0.08s linear; }
#face-note { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 70px);
  font-family: var(--body); font-size: 0.9rem; background: rgba(0, 0, 0, 0.75); border: 1px solid #ffb347; color: #fff;
  border-radius: 10px; padding: 8px 12px; max-width: calc(100% - 32px); text-align: center; }
.file { display: flex; align-items: center; justify-content: center; color: var(--sign); border-color: rgba(244, 197, 66, 0.45); }
.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.hint { font-size: 0.78rem; color: var(--muted); }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 80px); z-index: 6;
  font-family: var(--mono); font-size: 0.8rem; background: var(--glass); border: 1px solid var(--edge); border-radius: 8px;
  padding: 8px 12px; max-width: calc(100% - 32px); text-align: center;
}
#loading { position: fixed; inset: 0; z-index: 7; display: grid; place-items: center; background: var(--ground); text-align: center; padding: 0 24px;
  font-family: var(--display); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sign); }
.top, #toast { display: none !important; }
#race {
  width: 4.6rem; height: 4.6rem; min-height: 0; padding: 0; border: 0; border-radius: 999px;
  color: #fff; letter-spacing: 0.04em; font-size: 0.78rem;
  background: linear-gradient(180deg, #4ad24a, #1f9d4a 55%, #146b30);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), inset 0 -3px 4px rgba(0,0,0,0.35), 0 8px 16px rgba(0,0,0,0.35);
}
#race:active, #race.on { color: #fff; transform: translateY(2px); background: linear-gradient(180deg, #2fb33a, #146b30); box-shadow: inset 0 3px 6px rgba(0,0,0,0.45); }
.row, .song-row button { width: 100%; }
#race-hud {
  position: fixed; z-index: 6; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 12px);
  display: flex; justify-content: space-between; padding: 0 18px; pointer-events: none;
  font-family: var(--display); font-weight: 700; letter-spacing: 0.04em;
}
#race-hud b { display: block; font-size: 2.6rem; line-height: 1; color: var(--sign); }
#race-hud span { font-family: var(--body); font-size: 0.75rem; font-weight: 500; color: var(--muted); }
#race-time { font-size: 2.6rem; line-height: 1; text-align: right; }
#race-result {
  position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; text-align: center; pointer-events: none;
}
#race-card { pointer-events: auto; }
#race-fly { position: relative; width: 140px; height: 92px; margin: 0 auto 6px; }
#race-fly img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#race-fly .left { transform-origin: 68% 50%; }
#race-fly .right { transform-origin: 32% 50%; }
#race-fly.kick .left { animation: flapL 0.18s ease-out; }
#race-fly.kick .right { animation: flapR 0.18s ease-out; }
@keyframes flapL { 0%, 100% { transform: scaleX(1); } 45% { transform: scaleX(0.22) rotate(-8deg); } }
@keyframes flapR { 0%, 100% { transform: scaleX(1); } 45% { transform: scaleX(0.22) rotate(8deg); } }
#race-words {
  margin: 0 0 16px; font-family: var(--display); font-weight: 700; font-size: 3.4rem; letter-spacing: 0.06em;
  text-transform: uppercase; color: #fff; text-shadow: 0 4px 18px rgba(0,0,0,0.7);
}
#race-result { background: rgba(0, 0, 0, 0.72); }
#race-result.is-loss #race-words { font-size: 1.35rem; margin-bottom: 12px; }
#race-verse {
  display: block; max-width: 28rem; margin: 0 auto 16px; padding: 0 18px;
  color: #f6edd8; font-family: var(--body); font-size: 1.15rem; font-weight: 500;
  line-height: 1.45; letter-spacing: 0; text-transform: none;
}
#race-verse b { display: block; margin-top: 10px; font-family: var(--display); font-weight: 700; letter-spacing: 0.06em; }
.race-actions { display: flex; gap: 10px; justify-content: center; }
#dice-gate {
  position: fixed; inset: 0; z-index: 7; display: grid; place-items: center; align-content: center; gap: 14px;
  background: rgba(0, 0, 0, 0.35);
}
#dice {
  width: 5.5rem; height: 5.5rem; border: 0; border-radius: 1rem; color: #1a120c; font-size: 2.4rem;
  background: linear-gradient(180deg, #fff, #f4efe4 55%, #d9cbb0);
  box-shadow: inset 0 1px 0 #fff, inset 0 -4px 6px rgba(0,0,0,0.25), 0 12px 20px rgba(0,0,0,0.4);
}
#dice:active { transform: translateY(3px); box-shadow: inset 0 4px 8px rgba(0,0,0,0.35); }
#dice.spin { animation: dice-spin 0.7s linear; }
@keyframes dice-spin { to { transform: rotate(720deg) scale(1.08); } }
#dice-note, #level-note { margin: 0; color: #fff; font-family: var(--display); font-size: 1.4rem; letter-spacing: 0.04em; text-align: center; text-shadow: 0 2px 8px #000; }
#level-gate {
  position: fixed; inset: 0; z-index: 7; display: grid; place-items: center; align-content: center; gap: 12px;
  background: rgba(0, 0, 0, 0.45);
}
#level-gate button {
  width: min(16rem, 80vw); min-height: 3.4rem; border: 0; border-radius: 999px; color: #fff;
  background: linear-gradient(180deg, #3c3c3c, #2a2a2a 45%, #141414);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -3px 4px rgba(0,0,0,0.5);
}
#level-gate button:active { transform: translateY(2px); box-shadow: inset 0 3px 6px rgba(0,0,0,0.7); }
#level-gate button.is-locked { color: rgba(255,255,255,0.45); background: #1c1c1c; }
#race-wait { margin: 0; color: #ffb089; font-size: 1rem; }
#race-wait.is-sonic { color: #ffd36a; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.85rem; }
#dodge {
  position: fixed; inset: 0; z-index: 6; pointer-events: none;
}
#dodge button {
  position: absolute; top: 46%; width: 5.4rem; pointer-events: auto;
}
#dodge-left { left: max(12px, env(safe-area-inset-left, 0px)); }
#dodge-right { right: max(12px, env(safe-area-inset-right, 0px)); }
#tree-credit {
  position: fixed; z-index: 4; left: 10px; top: calc(env(safe-area-inset-top, 0px) + 6px);
  margin: 0; font-size: 0.62rem; color: rgba(255,255,255,0.7); text-shadow: 0 1px 2px #000;
}
#tree-credit a { color: inherit; }

</style>
</head>
<body>

<canvas id="view" aria-label="3D highway"></canvas>
<div id="loading" hidden><small id="loadmsg"></small></div>

<header class="top">
  <div class="plate name">Endless Highway<small>One 200 m tile, looped forever</small></div>
  <div class="plate gauges"><b id="kmh">0</b> km/h<br><span id="km">0.00</span> km driven<br><span id="boards">0</span> billboards passed</div>
</header>
<div id="toast" hidden></div>

<div id="race-hud" hidden>
  <div><b id="race-speed">0</b><span>km/h</span></div>
  <p id="race-wait"></p>
  <div id="race-time">0:40</div>
</div>
<div id="dodge" hidden>
  <button id="dodge-left" type="button">Left</button>
  <button id="dodge-right" type="button">Right</button>
</div>
<div id="level-gate" hidden>
  <p id="level-note">Choose a level</p>
  <button type="button" data-level="beginner">Beginner</button>
  <button type="button" data-level="driver">Driver</button>
  <button type="button" data-level="rave">Rave</button>
</div>
<div id="dice-gate" hidden>
  <button id="dice" type="button" aria-label="Toss the dice">?</button>
  <p id="dice-note">Toss before you set off</p>
</div>
<div id="race-result" hidden>
  <div id="race-card">
    <div id="race-fly" hidden>
      <img src="/wing-left.png?v=5" alt="" class="left">
      <img src="/wing-right.png?v=5" alt="" class="right">
    </div>
    <p id="race-words"></p>
    <p id="race-verse" hidden></p>
    <div class="race-actions">
      <button id="race-again" type="button">Try again</button>
      <button id="race-drive" type="button">Drive</button>
    </div>
  </div>
</div>

<button id="steer" type="button" aria-expanded="false">Steer</button>
<div id="steer-menu" hidden>
  <button id="tilt" type="button" aria-pressed="false" title="Steer by tilting the phone">Tilt</button>
  <button id="face" type="button" aria-pressed="false" title="Steer with your face">Face</button>
</div>
<div id="face-view" hidden><video id="face-video" playsinline muted></video><span id="face-dot"></span></div>
<div id="face-note" hidden></div>
<div class="dock">
  <div class="row">
    <button id="back" type="button">Rave</button>
    <button id="brake" type="button">Brake</button>
    <div class="cruise-stack">
      <button id="race" type="button">Race</button>
      <button id="cruise" type="button">Cruise</button>
    </div>
  </div>
  <div class="song-row">
    <button id="next" type="button">Next</button>
    <button id="night" type="button">Night</button>
    <button id="random" type="button">Bread</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const canvas = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc5daf2);
scene.fog = new THREE.Fog(0xc5daf2, 250, 1400);
const camera = new THREE.PerspectiveCamera(65, 1, 0.5, 5000);   // near 0.5 keeps far surfaces from flickering
const BASE_FOV = 65;
const SOUND = 343;
const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x4a5a3a, 1.6);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.2);
sun.position.set(80, 140, 120);
scene.add(hemi, sun);
const postLight = new THREE.SpotLight(0xffc98a, 0, 32, 0.75, 0.55, 1.3);
const postTarget = new THREE.Object3D();
postLight.target = postTarget;
const headLeft = new THREE.SpotLight(0xfff6e4, 0, 48, 1.15, 1, 1.2);
const headRight = new THREE.SpotLight(0xfff6e4, 0, 48, 1.15, 1, 1.2);
const headLeftTarget = new THREE.Object3D();
const headRightTarget = new THREE.Object3D();
headLeft.target = headLeftTarget;
headRight.target = headRightTarget;
scene.add(postLight, postTarget, headLeft, headRight, headLeftTarget, headRightTarget);
let night = false;
let daySky = null;
const nightSky = new THREE.TextureLoader().load("porchway-sky-night.jpg?v=2");
nightSky.colorSpace = THREE.SRGBColorSpace;

function roadBanner(word, color) {
  const board = document.createElement("canvas");
  board.width = 1024; board.height = 256;
  const pen = board.getContext("2d");
  pen.fillStyle = "#141414";
  pen.fillRect(0, 0, 1024, 256);
  pen.strokeStyle = color;
  pen.lineWidth = 18;
  pen.strokeRect(14, 14, 996, 228);
  pen.fillStyle = color;
  pen.font = "700 150px sans-serif";
  pen.textAlign = "center";
  pen.textBaseline = "middle";
  pen.fillText(word, 512, 136);
  const tex = new THREE.CanvasTexture(board);
  tex.colorSpace = THREE.SRGBColorSpace;
  const group = new THREE.Group();
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(18, 4.4), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, toneMapped: false }));
  sign.position.y = 6.2;
  group.add(sign);
  const pole = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.55, metalness: 0.25 });
  [-8.4, 8.4].forEach((x) => {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 8.2, 8), pole);
    post.position.set(x, 4.1, 0);
    group.add(post);
  });
  group.visible = false;
  scene.add(group);
  return group;
}
const startBanner = roadBanner("START", "#7fe3a0");
const finishBanner = roadBanner("FINISH", "#f4c542");
const stripe = document.createElement("canvas");
stripe.width = 512; stripe.height = 64;
const ink = stripe.getContext("2d");
for (let x = 0; x < 512; x += 64) {
  ink.fillStyle = (x / 64) % 2 ? "#111" : "#f4f4f4";
  ink.fillRect(x, 0, 64, 64);
}
const lineTex = new THREE.CanvasTexture(stripe);
lineTex.colorSpace = THREE.SRGBColorSpace;
const finishLine = new THREE.Mesh(new THREE.PlaneGeometry(16, 2.2), new THREE.MeshBasicMaterial({ map: lineTex, side: THREE.DoubleSide, toneMapped: false }));
finishLine.rotation.x = -Math.PI / 2;
finishLine.position.y = 0.04;
finishLine.visible = false;
scene.add(finishLine);

let TILE = 200, tiles = [], sky = null, screens = [];
const COPIES = 5;            // tiles alive at once: 1 behind, 4 ahead
let pos = 0, speed = 0, gas = 0, braking = false, yaw = 0, pitch = 0.03;
let eye = 1.3;
let brakeStop = null;
let brakeBoardZ = null;
let framing = false;
let raceBraking = false;
let lane = 0, laneTarget = 0, dodge = null, waitWord = "";
let treeLocals = [];

function onFail() {
  const box = document.getElementById("loading");
  box.hidden = false;
  document.getElementById("loadmsg").textContent = "Couldn't load the highway model. Reload the page to try again.";
}
function asphaltGrit() {
  const size = 512;
  const cells = 64;
  const height = new Float32Array(size * size);
  function hash(ix, iy) {
    ix = ((ix % cells) + cells) % cells;
    iy = ((iy % cells) + cells) % cells;
    const n = Math.sin(ix * 127.1 + iy * 311.7) * 43758.5453;
    return n - Math.floor(n);
  }
  function noise(x, y) {
    const x0 = Math.floor(x);
    const y0 = Math.floor(y);
    const fx = x - x0;
    const fy = y - y0;
    const sx = fx * fx * (3 - 2 * fx);
    const sy = fy * fy * (3 - 2 * fy);
    const a = hash(x0, y0);
    const b = hash(x0 + 1, y0);
    const c = hash(x0, y0 + 1);
    const d = hash(x0 + 1, y0 + 1);
    return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
  }
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const grit = noise(x / 2.2, y / 2.2) * 0.55 + noise(x / 6, y / 6) * 0.3 + noise(x / 14, y / 14) * 0.15;
      const pit = noise(x / 1.3 + 20, y / 1.3 + 8) > 0.82 ? 0.22 : 0;
      height[y * size + x] = grit - pit;
    }
  }
  const color = document.createElement("canvas");
  color.width = size;
  color.height = size;
  const pen = color.getContext("2d");
  const pixels = pen.createImageData(size, size);
  const bump = document.createElement("canvas");
  bump.width = size;
  bump.height = size;
  const penN = bump.getContext("2d");
  const normals = penN.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const h = height[y * size + x];
      const stone = h > 0.72 ? 150 + (h - 0.72) * 280 : h < 0.28 ? 8 + h * 30 : 22 + h * 70;
      const i = (y * size + x) * 4;
      pixels.data[i] = stone;
      pixels.data[i + 1] = stone;
      pixels.data[i + 2] = Math.min(255, stone + 5);
      pixels.data[i + 3] = 255;
      const hL = height[y * size + ((x - 1 + size) % size)];
      const hR = height[y * size + ((x + 1) % size)];
      const hD = height[((y - 1 + size) % size) * size + x];
      const hU = height[((y + 1) % size) * size + x];
      let nx = (hL - hR) * 3.2;
      let ny = (hD - hU) * 3.2;
      let nz = 1;
      const len = Math.hypot(nx, ny, nz);
      nx /= len; ny /= len; nz /= len;
      normals.data[i] = (nx * 0.5 + 0.5) * 255;
      normals.data[i + 1] = (ny * 0.5 + 0.5) * 255;
      normals.data[i + 2] = (nz * 0.5 + 0.5) * 255;
      normals.data[i + 3] = 255;
    }
  }
  pen.putImageData(pixels, 0, 0);

function keepEdgeLines(mesh) {
  const geo = mesh.geometry;
  const pos = geo.getAttribute("position");
  const index = geo.getIndex();
  if (!pos || !index) return;
  const next = [];
  for (let i = 0; i < index.count; i += 3) {
    const a = index.getX(i);
    const b = index.getX(i + 1);
    const c = index.getX(i + 2);
    if (Math.abs(pos.getX(a)) > 5 && Math.abs(pos.getX(b)) > 5 && Math.abs(pos.getX(c)) > 5) next.push(a, b, c);

}

function centerDashes(length) {
  const width = 0.15;
  const dash = 3.2;
  const gap = 1.6;
  const count = Math.max(1, Math.round(length / (dash + gap)));
  const period = length / count;
  const dashLen = period * (dash / (dash + gap));
  const y = 0.06;
  const positions = new Float32Array(count * 12);
  const normals = new Float32Array(count * 12);
  const indices = [];
  for (let i = 0; i < count; i++) {
    const z0 = -length + i * period;
    const z1 = z0 + dashLen;
    const x0 = -width / 2;
    const x1 = width / 2;
    const o = i * 12;
    positions[o] = x0; positions[o + 1] = y; positions[o + 2] = z0;
    positions[o + 3] = x1; positions[o + 4] = y; positions[o + 5] = z0;
    positions[o + 6] = x1; positions[o + 7] = y; positions[o + 8] = z1;
    positions[o + 9] = x0; positions[o + 10] = y; positions[o + 11] = z1;
    for (let n = 0; n < 12; n += 3) { normals[o + n] = 0; normals[o + n + 1] = 1; normals[o + n + 2] = 0; }
    const b = i * 4;
    indices.push(b, b + 1, b + 2, b, b + 2, b + 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.setAttribute("normal", new THREE.BufferAttribute(normals, 3));
  geo.setIndex(indices);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xf08a12,
    side: THREE.DoubleSide,
    toneMapped: false,
    polygonOffset: true,
    polygonOffsetFactor: -1,
    polygonOffsetUnits: -1,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.renderOrder = 2;
  mesh.name = "CenterDash";
  return mesh;
}

<script type="module">
// Steer by tilting the phone, like a steering wheel. No head or eye movement
// needed, and it works in the dark. Uses the phone's motion sensor only.
const steer = (window.porchFace = window.porchFace || { on: false, lane: 0 });
const button = document.getElementById("tilt");
const note = document.getElementById("face-note");
let on = false, centre = null, samples = [], smooth = 0, held = 0, lastDodge = 0;
function say(text, ms = 3000) {
  note.textContent = text; note.hidden = false;
  clearTimeout(say.t); if (ms) say.t = setTimeout(() => (note.hidden = true), ms);
}
// Left-right tilt in degrees, whichever way the phone is held.
function tiltOf(e) {
  const angle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  if (angle === 90) return e.beta;
  if (angle === -90 || angle === 270) return -e.beta;
  return e.gamma;
}
function onTilt(e) {
  if (!on || e.gamma === null || e.beta === null) return;
  const t = tiltOf(e);
  if (centre === null) {
    samples.push(t);
    if (samples.length >= 10) { centre = samples.reduce((a, b) => a + b, 0) / samples.length; say("Ready. Tilt the phone to steer.", 2500); }
    return;
  }
  let v = (t - centre) / 18; // about 18 degrees of tilt = full turn
  if (Math.abs(v) < 0.12) v = 0; // small wobbles don't swerve the car
  v = Math.max(-1, Math.min(1, v));
  smooth = smooth * 0.8 + v * 0.2; // steady: smooths shaky hands
  steer.lane = smooth;
  const dodgeBox = document.getElementById("dodge");
  if (dodgeBox && !dodgeBox.hidden && Math.abs(smooth) > 0.6) {
    held += 1;
    if (held > 6 && performance.now() - lastDodge > 1200) { lastDodge = performance.now(); held = 0; window.porchCommitDodge && window.porchCommitDodge(smooth < 0 ? -1 : 1); }
  } else held = 0;
}
async function start() {
  if (window.porchFaceOff) window.porchFaceOff();
  if (typeof DeviceOrientationEvent === "undefined") { say("This device has no tilt sensor."); return; }
  if (typeof DeviceOrientationEvent.requestPermission === "function") {
    try {
      if ((await DeviceOrientationEvent.requestPermission()) !== "granted") { say("Allow motion access to steer by tilting."); return; }
    } catch { say("Allow motion access to steer by tilting."); return; }
  }
  centre = null; samples = []; smooth = 0; on = true;
  steer.on = true; steer.lane = 0;
  addEventListener("deviceorientation", onTilt);
  button.classList.add("on"); button.setAttribute("aria-pressed", "true");
  say("Hold the phone how you like it…", 0);
  setTimeout(() => { if (on && centre === null) say("No tilt sensor reading. Try another phone, or use the buttons."); }, 3000);
}
function stop() {
  on = false; steer.on = false; steer.lane = 0;
  removeEventListener("deviceorientation", onTilt);
  button.classList.remove("on"); button.setAttribute("aria-pressed", "false");
}
window.porchTiltOff = () => { if (on) stop(); };
button.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); if (on) { stop(); say("Tilt steering off.", 1500); } else void start(); });
</script>
